<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />

    <!-- ✅ Primary SEO Meta -->
    <title>Swish Assistant | The Home of Basketball Stats, Advanced Metrics & League Insights
</title>
    <meta
      name="description"
      content="Swish Assistant revolutionizes basketball stats for players, coaches, and leagues. Access AI-powered scouting tools, live data, and player insights from NBL, WNBL, BCB, SLB Championship and more."
    />
    <meta
      name="keywords"
      content="basketball stats, AI scouting, NBL, WNBL, BCB, SLB, Super League Basketball, UK basketball, analytics, player stats, Swish Assistant"
    />
    <meta name="author" content="Swish Assistant" />

    <!-- ✅ Open Graph (for social sharing) -->
    <meta property="og:title" content="Swish Assistant | AI Basketball Stats & Scouting Platform" />
    <meta
      property="og:description"
      content="Find your NBL, WNBL, BCB and SLB Championship stats, analyze your performance, and explore leagues through AI-driven basketball insights."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://swishassistant.com/og-image.png" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swish Assistant | AI Basketball Stats & Scouting Platform" />
    <meta
      name="twitter:description"
      content="AI-powered basketball analytics and scouting tools for players, coaches, and leagues."
    />
    <meta name="twitter:image" content="https://swishassistant.com/og-image.png" />

    <!-- ✅ Favicon (optional, replace with your own path) -->
    <link rel="icon" type="image/png" href="/swish-logo-favicon.png" /> 

    <!-- ✅ Home Screen / PWA Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Swish" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />

    <!-- No canonical here: this shell is served for every page, so a fixed
         one told Google every page was a copy of the homepage. Public pages
         get their own from the server (server/publicSeo.ts) and Helmet. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
